<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin Forge</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="mark">PF</div><div><p class="eyebrow">CHATGPT PLUGIN BUILDER</p><h1>Build a plugin from an idea.</h1></div></header><p class="intro">Describe what you want your plugin to do. Get a ready starter package without leaving ChatGPT.</p>
<form id="form"><label>Plugin name<input name="name" required maxlength="64" placeholder="Travel concierge"></label><label>What does it do?<textarea name="description" required maxlength="280" placeholder="Plans trips and helps users book hotels and transport."></textarea></label><label>Main goal<textarea name="goal" required maxlength="600" placeholder="Help English and Arabic speakers plan a trip and compare options."></textarea></label><label>How should it work?<textarea name="workflow" required maxlength="800" placeholder="Ask dates and budget, show options, confirm before booking."></textarea></label><label class="toggle"><input name="includesMcp" type="checkbox"><span><b>Include a server starter</b><small>Add a basic MCP server template for live tools and actions.</small></span></label><button>Create plugin package</button></form>
<section id="result" hidden><div class="result-head"><div><p class="eyebrow">YOUR STARTER PACKAGE</p><h2 id="result-title"></h2></div><button id="download" class="secondary">Download ZIP</button></div><p id="result-desc"></p><div id="file-list"></div><p class="note">This creates a starter package. A plugin with live actions needs a hosted MCP server before other people can use it.</p></section>
</main><script src="/app.js"></script></body></html>
